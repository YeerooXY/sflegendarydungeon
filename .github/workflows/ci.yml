name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
            executable: build/sfld
          - os: ubuntu-latest
            compiler: clang++
            executable: build/sfld
          - os: windows-latest
            compiler: cl
            executable: build/Release/sfld.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify study recorder and controller
        run: python -m unittest discover -s tests -p test_study.py -v
      - name: Exercise offline observation pipeline
        run: python tools/study.py demo --directory out/study-fixture
      - name: Exercise sweeps
        run: ${{ matrix.executable }} compare --allow-assumptions --sweep gems --runs 1000 --threads 2 --output results/gems.json
      - name: Forecast from observed progress
        run: ${{ matrix.executable }} compare --allow-assumptions --state examples/gem-choice.state --sweep gems --runs 1000 --threads 2 --output results/progress-gems.json
      - name: Compare targeted shop rerolls
        run: ${{ matrix.executable }} compare --allow-assumptions --state examples/reroll-shop.state --sweep shops --rerolls 10 --budget 30 --recovery-budget 0 --runs 1000 --threads 2 --output results/shop-strategies.json
      - name: Record a trace
        run: ${{ matrix.executable }} simulate --allow-assumptions --runs 1 --trace results/run.tsv --output results/run.json
      - name: Exercise repeated-run events
        run: ${{ matrix.executable }} event --allow-assumptions --runs 1000 --threads 2 --budget 500 --deadline-hours 168 --output results/event.json
      - name: Train a small policy and evaluate separate seeds
        run: ${{ matrix.executable }} train --allow-assumptions --generations 2 --population 8 --training-events 4 --runs 100 --threads 2 --budget 0 --save-policy results/f2p.policy --output results/learning.json
      - name: Verify trace
        run: ${{ matrix.executable }} replay --allow-assumptions --trace results/run.tsv
      - name: Upload executable and sample reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sfld-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            ${{ matrix.executable }}
            profiles/
            examples/
            docs/
            data/vods/
            tools/study.py
            tools/sfld_study/*.py
            tools/visual_lab.py
            tools/extract_local_art.py
            tools/vod.py
            tools/vod_traps.py
            tools/vod_trials.py
            tools/vod_doors.py
            tools/vod_recognize.py
            tools/vod_full_traps.py
            tools/vod_full_reanalysis.py
            tools/vod_arena_rewards.py
            tools/vod_full_door_check.py
            tools/vod_calibration_evidence.py
            tools/benchmark_strategies.py
            tools/benchmark_vod_assumptions.py
            src/strategy.cpp
            tools/vod_entry_reanalysis.py
            tools/vod_container_reanalysis.py
            tools/vod_trap_detector.py
            tools/vod_benchmark.py
            tools/vod_transitions.py
            tools/analyze_vod_traps.py
            tools/analyze_vod_monsters.py
            tools/render_vod_monster_report.py
            tools/analyze_vod_containers.py
            tools/prepare_container_audit.py
            tools/record_container_audit.py
            tools/requirements-vod.txt
            tools/requirements-vod-ocr.txt
            tools/sfld_vod/*.py
            tools/sfld_vod/*.html
            web/index.html
            web/app.js
            web/style.css
            results/
            README.md
            LICENSE
          retention-days: 14

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DSFLD_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Exercise spending and random transitions
        run: build/sfld compare --allow-assumptions --state examples/progress.state --sweep budgets --runs 1000 --threads 2 --rerolls 3 --output results/budgets.json
      - name: Exercise targeted shop rerolls
        run: build/sfld compare --allow-assumptions --state examples/reroll-shop.state --sweep shops --rerolls 10 --budget 30 --recovery-budget 0 --runs 1000 --threads 2 --output results/shops.json
      - name: Exercise event learning
        run: build/sfld train --allow-assumptions --generations 2 --population 8 --training-events 4 --runs 100 --threads 2 --budget 500 --save-policy results/paid.policy --output results/learning.json
